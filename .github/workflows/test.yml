name: Verify pull request

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Install PDF tools the form tests read output with
        run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
      - name: Fetch the base branch for the oracle check
        run: git fetch --no-tags --depth=1 origin main
      - name: Nodes placed, registered and reachable
        run: bun run check:structure
      - name: Benchmark cases fit their node schemas and cite a publication
        run: bun run check:cases
      - name: Expected values change only with a cited ledger entry
        run: bun run check:oracle --base origin/main
      - name: The binary can only reach the network through restricted fetch
        run: bun run check:sandbox
      - name: Graph preflight, type check and typed unit and harness verification
        run: bun run test:unit
      - name: Node, export and return-processing tests fail only on known, baselined failures
        run: bun run test:forms
      - name: Preserve verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-report
          path: .state/research/testing/
          include-hidden-files: true
          if-no-files-found: error

# Private IRS schemas, reviewed attachment bytes and ATS acceptance require
# the separately recorded full/evidence gates; this job does not claim them.
