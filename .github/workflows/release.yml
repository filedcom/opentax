name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build only, skip release creation"
        type: boolean
        default: true
      version:
        description: "Tag to create on the dispatched commit, e.g. v2.1.0 (needs dry_run off)"
        type: string
        default: ""

env:
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version }}

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: bun-linux-x64-baseline
            os: ubuntu-latest
            asset: opentax-linux-x64
          - target: bun-linux-arm64
            os: ubuntu-24.04-arm
            asset: opentax-linux-arm64
          - target: bun-darwin-x64-baseline
            os: macos-15-intel
            asset: opentax-macos-x64
          - target: bun-darwin-arm64
            os: macos-15
            asset: opentax-macos-arm64
          - target: bun-windows-x64-baseline
            os: windows-latest
            asset: opentax-windows-x64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Set version
        shell: bash
        run: |
          if [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            VERSION="${RELEASE_TAG#v}"
          elif [[ -n "$RELEASE_TAG" ]]; then
            echo "Invalid version: $RELEASE_TAG"; exit 1
          else
            VERSION="0.0.0-dev"
          fi
          sed -i.bak "s/export const VERSION = \"dev\"/export const VERSION = \"${VERSION}\"/" cli/version.ts
          rm -f cli/version.ts.bak
          grep -q "\"${VERSION}\"" cli/version.ts || { echo "Version injection failed"; exit 1; }
          echo "Building version ${VERSION}"
          echo "OPENTAX_RELEASE_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Compile
        run: >
          bun build cli/main.ts --compile
          --target=${{ matrix.target }}
          --outfile ${{ matrix.asset }}

      - name: Smoke compiled asset
        run: >
          bun scripts/release/smoke-release-binary.ts
          ./${{ matrix.asset }} ${{ env.OPENTAX_RELEASE_VERSION }}
          smoke-${{ matrix.asset }}.json

      - name: Upload smoke transcript
        uses: actions/upload-artifact@v4
        with:
          name: smoke-transcript-${{ matrix.asset }}
          path: smoke-${{ matrix.asset }}.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    if: >-
      startsWith(github.ref, 'refs/tags/v') && (github.event_name != 'workflow_dispatch' || inputs.dry_run == false)
      || github.event_name == 'workflow_dispatch' && inputs.dry_run == false && inputs.version != ''
        && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: opentax-*
          merge-multiple: true

      - name: Verify assets and write checksums
        shell: bash
        run: |
          cd artifacts
          expected=(opentax-linux-x64 opentax-linux-arm64 opentax-macos-x64 opentax-macos-arm64 opentax-windows-x64.exe)
          [[ "$(find . -maxdepth 1 -type f | wc -l)" -eq 5 ]]
          for asset in "${expected[@]}"; do test -s "$asset"; done
          sha256sum "${expected[@]}" > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Refuse an existing tag
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Tag ${RELEASE_TAG} already exists"; exit 1
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: artifacts/*
          generate_release_notes: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-checkpoint.') }}
